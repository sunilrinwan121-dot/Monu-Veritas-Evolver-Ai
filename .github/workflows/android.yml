name: MONU Mobile Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MONU Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MONU-Mobile

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android Project
        run: |
          pwd
          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          chmod +x gradlew

      - name: Prepare Release Keystore
        env:
          MONU_KEYSTORE_BASE64: ${{ secrets.MONU_KEYSTORE_BASE64 }}
        run: |
          test -n "$MONU_KEYSTORE_BASE64"
          echo "$MONU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/monu-release.jks"
          test -s "$RUNNER_TEMP/monu-release.jks"

      - name: Build Release APK
        env:
          MONU_KEYSTORE_PATH: ${{ runner.temp }}/monu-release.jks
          MONU_KEYSTORE_PASSWORD: ${{ secrets.MONU_KEYSTORE_PASSWORD }}
          MONU_KEY_ALIAS: ${{ secrets.MONU_KEY_ALIAS }}
          MONU_KEY_PASSWORD: ${{ secrets.MONU_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$MONU_KEYSTORE_PASSWORD"
          test -n "$MONU_KEY_ALIAS"
          test -n "$MONU_KEY_PASSWORD"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MONU-release-APK
          path: MONU-Mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
